name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Check each Modal app builds its object graph
        # Catches decorator/signature mistakes without needing Modal credentials.
        # Separate processes: both services define a module named `app`.
        run: |
          for project in ideogram4 flux2klein; do
            uv run python -c "import sys; sys.path.insert(0, '$project'); import app; print('$project ->', app.app.name)"
          done
